name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"   # lunes 12:00 UTC: revisa vulnerabilidades nuevas aunque no haya PRs

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharma_user
          POSTGRES_PASSWORD: pharma_pass
          POSTGRES_DB: pharmasphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharma_user -d pharmasphere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pharma_user:pharma_pass@localhost:5432/pharmasphere
      SECRET_KEY: ci-secret-key
      PGPASSWORD: pharma_pass

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest httpx

      - name: Crear esquema base y seed
        run: |
          psql -h localhost -U pharma_user -d pharmasphere -v ON_ERROR_STOP=1 -f app/db/init/init.sql
          psql -h localhost -U pharma_user -d pharmasphere -v ON_ERROR_STOP=1 -f app/db/init/seed.sql

      - name: Marcar punto de partida
        run: alembic stamp 6033595434e9

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Verificar que los modelos coinciden con la base
        run: alembic check

      - name: Tests (pytest)
        run: python -m pytest app/test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

  audit-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: